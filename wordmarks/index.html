<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vintage Blue — Wordmark options</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Anton&display=swap" rel="stylesheet" />
    <style>
      :root { --page: #fcfaf6; --ink: #141414; --soft: rgba(20, 20, 20, 0.6); --gut: clamp(16px, 2.2vw, 32px); }
      * { box-sizing: border-box; }
      body { margin: 0; background: #ece9e3; color: var(--ink); font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      .intro { padding: 28px var(--gut) 8px; font-size: 13px; color: var(--soft); }
      .intro b { color: var(--ink); }
      .opt { margin: 18px 0 0; }
      .tag { display: flex; justify-content: space-between; padding: 0 var(--gut) 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
      .tag span { color: var(--soft); font-weight: 500; text-transform: none; letter-spacing: 0; }
      .bar { display: flex; align-items: center; gap: 34px; height: 64px; padding: 0 var(--gut); background: var(--page); border-top: 1px solid rgba(20, 20, 20, 0.08); border-bottom: 1px solid rgba(20, 20, 20, 0.08); }
      .mark { margin-right: auto; line-height: 1; white-space: nowrap; }
      .links { display: flex; gap: 30px; font-size: 14px; text-transform: uppercase; color: var(--soft); }
      .bag { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; text-transform: uppercase; }
      .bag i { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border: 1px solid currentColor; font-style: normal; font-size: 10px; }
      .stack { display: grid; line-height: 0.92; }
      .mono { display: inline-flex; align-items: center; gap: 12px; }
      .mono b { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1.5px solid var(--ink); font-size: 13px; font-weight: 800; letter-spacing: -0.04em; }
      .dark .bar { background: #141414; color: #f1efe9; }
      .dark .links { color: rgba(241, 239, 233, 0.6); }
      @media (max-width: 760px) { .links { display: none; } }
    </style>
  </head>
  <body>
    <p class="intro"><b>Vintage Blue — wordmark options for the menu bar.</b> Same bar, only the name changes. Tell me the number.</p>
    <main id="list"></main>
    <script>
      const opts = [
        ["Current", "Inter Bold · 18px · tight", 'font-size:18px;font-weight:700;letter-spacing:-0.02em;text-transform:uppercase', "Vintage Blue"],
        ["Heavier, bigger", "Inter Black · 24px · very tight", 'font-size:24px;font-weight:900;letter-spacing:-0.055em;text-transform:uppercase', "Vintage Blue"],
        ["Wide-spaced, light", "Inter Medium · 14px · tracked 0.32em", 'font-size:14px;font-weight:500;letter-spacing:0.32em;text-transform:uppercase', "Vintage Blue"],
        ["Thin and airy", "Inter Light · 20px · tracked 0.16em", 'font-size:20px;font-weight:300;letter-spacing:0.16em;text-transform:uppercase', "Vintage Blue"],
        ["Quiet, small", "Inter Semibold · 13px · tracked 0.2em", 'font-size:13px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase', "Vintage Blue"],
        ["Normal case", "Inter Semibold · 20px · tight", 'font-size:20px;font-weight:600;letter-spacing:-0.035em', "Vintage Blue"],
        ["Lowercase", "Inter Bold · 21px · tight", 'font-size:21px;font-weight:700;letter-spacing:-0.045em', "vintage blue"],
        ["Stacked", "Inter Extra Bold · 15px · two lines", 'font-size:15px;font-weight:800;letter-spacing:-0.03em;text-transform:uppercase', '<span class="stack"><span>Vintage</span><span>Blue</span></span>'],
        ["Condensed poster", "Anton · 24px", 'font-family:Anton,Inter,sans-serif;font-size:24px;font-weight:400;letter-spacing:0.01em;text-transform:uppercase', "Vintage Blue"],
        ["Monogram + name", "VB box + Inter Medium 13px", 'font-size:13px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase', '<span class="mono"><b>VB</b>Vintage Blue</span>'],
        ["With a full stop", "Inter Black · 22px · tight", 'font-size:22px;font-weight:900;letter-spacing:-0.05em;text-transform:uppercase', "Vintage Blue."],
        ["Spaced words", "Inter Bold · 16px · wide gap", 'font-size:16px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;word-spacing:0.6em', "Vintage Blue"],
      ];
      const bar = (style, text) => `<div class="bar"><span class="mark" style="${style}">${text}</span><nav class="links"><span>Shop</span><span>Lookbook</span><span>About</span><span>Contact</span></nav><span class="bag">Bag <i>0</i></span></div>`;
      document.getElementById("list").innerHTML = opts.map(([name, note, style, text], i) => `
        <section class="opt"><p class="tag"><span style="color:var(--ink);font-weight:700">${String(i + 1).padStart(2, "0")} — ${name}</span><span>${note}</span></p>${bar(style, text)}</section>`).join("") +
        `<section class="opt dark"><p class="tag"><span style="color:var(--ink);font-weight:700">On black — option 02 for comparison</span><span>Same bar on a dark page</span></p>${bar(opts[1][2], opts[1][3])}</section>`;
    </script>
  </body>
</html>
