<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vintage Blue — Sections after the film</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --page: #fcfaf6; --ink: #141414; --soft: rgba(20, 20, 20, 0.58); --rule: rgba(20, 20, 20, 0.2); --grey: #e9e7e2; --denim: #1e2f4f; --gut: clamp(16px, 2.6vw, 40px); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: var(--page); color: var(--ink); font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      img, video { display: block; max-width: 100%; }
      main { height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; }
      .s { position: relative; min-height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; padding: 72px var(--gut) 56px; overflow: hidden; }
      .tag { position: absolute; top: 18px; left: var(--gut); z-index: 5; padding: 5px 10px; background: #ffd84a; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      #count { position: fixed; z-index: 10; right: 16px; bottom: 14px; padding: 7px 11px; background: rgba(20, 20, 20, 0.7); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }

      .t-sec { margin: 0; font-size: clamp(18px, 1.5vw, 24px); font-weight: 500; text-transform: uppercase; letter-spacing: -0.01em; }
      .t-big { margin: 0; font-size: clamp(44px, 6.4vw, 116px); font-weight: 700; line-height: 0.9; letter-spacing: -0.05em; text-transform: uppercase; }
      .t-mid { margin: 0; font-size: clamp(24px, 2.6vw, 42px); font-weight: 600; line-height: 1; letter-spacing: -0.035em; text-transform: uppercase; }
      .t-body { margin: 0; max-width: 40ch; font-size: 14.5px; line-height: 1.6; color: var(--soft); }
      .sm { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.02em; }
      .soft { color: var(--soft); }
      .head { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 22px; }
      .u { font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
      .btn { display: inline-flex; padding: 14px 26px; border: 1px solid currentColor; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; transition: background 0.3s, color 0.3s; }
      .btn:hover { background: var(--ink); color: var(--page); }
      .grey { background: var(--grey); }
      .cut { object-fit: contain; object-position: bottom; }

      /* 1 Fit line-up */
      .lineup { display: grid; grid-template-columns: repeat(4, 1fr); align-items: end; border-bottom: 1px solid var(--ink); }
      .lineup figure { margin: 0; position: relative; }
      .lineup img { width: 100%; height: 62vh; }
      .lineup-l { display: grid; grid-template-columns: repeat(4, 1fr); }
      .lineup-l div { padding: 14px 0 0; }
      .lineup-l b { display: block; font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.02em; }
      .lineup-l span { font-size: 12.5px; color: var(--soft); }

      /* 2 Fit anatomy */
      .anat { display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: center; gap: 2vw; }
      .anat .fig { position: relative; height: 82vh; }
      .anat .fig img { width: 100%; height: 100%; }
      .callouts { display: grid; gap: 38px; }
      .callouts div { border-top: 1px solid var(--ink); padding-top: 12px; }
      .callouts b { display: block; font-size: clamp(30px, 3vw, 48px); font-weight: 700; letter-spacing: -0.04em; }
      .anat .r { text-align: right; }

      /* 3 Big price */
      .price { align-items: center; text-align: center; }
      .price .num { font-size: clamp(120px, 24vw, 420px); font-weight: 800; line-height: 0.8; letter-spacing: -0.07em; }
      .corner { position: absolute; font-size: 12px; font-weight: 500; text-transform: uppercase; line-height: 1.4; }

      /* 4 How it's made */
      .made { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .made .img { aspect-ratio: 3 / 4.2; overflow: hidden; }
      .made .img img { width: 100%; height: 100%; object-fit: cover; }
      .made h3 { margin: 16px 0 6px; font-size: 18px; font-weight: 600; text-transform: uppercase; }

      /* 5 Wash swatches */
      .sw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; border: 1px solid var(--rule); }
      .sw a { border-right: 1px solid var(--rule); }
      .sw a:last-child { border-right: 0; }
      .sw .chip { aspect-ratio: 1 / 1.4; overflow: hidden; }
      .sw .chip img { width: 100%; height: 100%; object-fit: cover; transform: scale(3.2); transform-origin: 50% 38%; transition: transform 0.6s; }
      .sw a:hover .chip img { transform: scale(2.6); }
      .sw p { margin: 0; padding: 12px; font-size: 11.5px; text-transform: uppercase; border-top: 1px solid var(--rule); }

      /* 6 Shop the look on a cut-out */
      .look { display: grid; grid-template-columns: 1fr 1fr; min-height: 86vh; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
      .look .l { display: grid; place-items: end center; background: var(--grey); }
      .look .l img { height: 80vh; }
      .look .r { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 4vw, 64px); }
      .look ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--ink); }
      .look li { display: grid; grid-template-columns: 64px 1fr auto; gap: 18px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
      .look li img { width: 64px; aspect-ratio: 3 / 4; object-fit: cover; background: var(--grey); }

      /* 7 Wear diary */
      .diary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .diary .img { aspect-ratio: 3 / 4; overflow: hidden; }
      .diary .img img { width: 100%; height: 100%; object-fit: cover; }
      .diary p { margin: 10px 0 0; display: flex; justify-content: space-between; font-size: 12.5px; text-transform: uppercase; }
      .line { height: 1px; background: var(--ink); margin: 24px 0 10px; position: relative; }

      /* 8 Care rules */
      .care { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); }
      .care div { padding: 28px 24px 0 0; }
      .care div + div { padding-left: 24px; border-left: 1px solid var(--rule); }
      .care b { display: block; margin-bottom: 14px; font-size: clamp(24px, 2.4vw, 40px); font-weight: 700; line-height: 0.95; letter-spacing: -0.04em; text-transform: uppercase; }

      /* 9 Studio */
      .studio { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0; min-height: 86vh; }
      .studio .img { overflow: hidden; }
      .studio .img img { width: 100%; height: 100%; object-fit: cover; }
      .studio .r { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 4vw, 64px); background: var(--ink); color: #f1efe9; }
      .studio .r .t-body { color: rgba(241, 239, 233, 0.7); }
      .studio dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 12px 28px; font-size: 13.5px; }
      .studio dt { color: rgba(241, 239, 233, 0.55); text-transform: uppercase; font-size: 11.5px; }

      /* 10 Marquee + row */
      .mq { overflow: hidden; white-space: nowrap; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 0 calc(-1 * var(--gut)); }
      .mq div { display: inline-flex; gap: 3vw; padding: 2.2vw 0; animation: mq 30s linear infinite; font-size: clamp(44px, 7vw, 124px); font-weight: 700; letter-spacing: -0.05em; text-transform: uppercase; }
      .mq i { font-style: normal; color: rgba(20, 20, 20, 0.18); }
      @keyframes mq { to { transform: translateX(-50%); } }
      .row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin: 30px calc(-1 * var(--gut)) 0; border-bottom: 1px solid var(--rule); }
      .row5 a { background: var(--grey); border-right: 1px solid var(--rule); }
      .row5 a:last-child { border-right: 0; }
      .row5 .img { aspect-ratio: 4 / 5; }
      .row5 .img img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }
      .row5 p { margin: 0; padding: 12px; text-align: center; font-size: 11.5px; text-transform: uppercase; }

      /* 11 Numbers + cut-out */
      .nums { display: grid; grid-template-columns: 1fr auto 1fr; gap: 3vw; align-items: center; }
      .nums .fig img { height: 78vh; }
      .nums .col { display: grid; gap: 42px; }
      .nums .col div { border-top: 1px solid var(--ink); padding-top: 12px; }
      .nums b { display: block; font-size: clamp(54px, 6.4vw, 110px); font-weight: 800; line-height: 0.9; letter-spacing: -0.06em; }
      .nums .r { text-align: right; }

      /* 12 Sign-up */
      .join { background: #1c1c1a; color: #eceae4; align-items: center; text-align: center; }
      .join form { display: flex; width: min(560px, 100%); margin: 30px auto 0; border-bottom: 1px solid rgba(236, 234, 228, 0.6); }
      .join input { flex: 1; padding: 14px 0; border: 0; background: transparent; color: inherit; font: inherit; font-size: 14px; outline: none; }
      .join input::placeholder { color: rgba(236, 234, 228, 0.55); }
      .join button { border: 0; background: transparent; color: inherit; font: inherit; font-size: 12px; text-transform: uppercase; cursor: pointer; }
      .join .t-body { color: rgba(236, 234, 228, 0.65); margin: 16px auto 0; }

      @media (max-width: 900px) {
        .lineup, .lineup-l, .diary, .care { grid-template-columns: 1fr 1fr; }
        .anat, .look, .studio, .nums, .made { grid-template-columns: 1fr; }
        .sw { grid-template-columns: repeat(4, 1fr); }
        .row5 { grid-template-columns: repeat(3, 1fr); }
        .lineup img { height: 40vh; }
      }
    </style>
  </head>
  <body>
    <main id="deck"><p style="padding:40px">Loading…</p></main>
    <div id="count"></div>
    <script type="module">
      const raw = await (await fetch("/data/products.json")).json();
      const products = Array.isArray(raw) ? raw : raw.products;
      const by = new Map(products.map((p) => [p.handle, p]));
      const P = (h) => by.get(h);
      const inr = (n) => "₹" + n.toLocaleString("en-IN");
      const model = (p) => p.images.find((i) => /-model-(?!back)/.test(i)) || p.images[0];
      const front = (p) => p.images.find((i) => i.includes("-front")) || p.images[0];
      const color = (p) => p.name.split("—").pop().trim();
      const FITS = [["hulk", "Hulk", "Super baggy", "58 cm leg"], ["rock", "Rock", "Baggy", "52 cm leg"], ["jazz", "Jazz", "Comfort", "48 cm leg"], ["brawny", "Brawny", "Straight", "44 cm leg"]];
      const brawny = products.filter((p) => p.handle.startsWith("brawny-"));

      const slides = [
        ["Fit line-up — all four on one floor", `
          <div class="head"><h2 class="t-sec">The line-up</h2><a class="u" href="#">Compare fits</a></div>
          <div class="lineup">${FITS.map(([k]) => `<figure><img class="cut" src="/assets/fits/${k}.png" alt="" /></figure>`).join("")}</div>
          <div class="lineup-l">${FITS.map(([k, n, f, leg]) => `<div><b>${n}</b><span>${f} · ${leg}</span></div>`).join("")}</div>`],
        ["Fit anatomy — one model, the numbers around him", `
          <div class="anat">
            <div class="callouts"><div><span class="sm soft">Rise</span><b>29 cm</b><span class="t-body">Sits on the hip, not the waist.</span></div><div><span class="sm soft">Thigh</span><b>36 cm</b><span class="t-body">Room through the top block.</span></div></div>
            <div class="fig"><img class="cut" src="/assets/fits/hulk.png" alt="Model in Hulk jeans" /></div>
            <div class="callouts r"><div><span class="sm soft">Leg opening</span><b>58 cm</b><span class="t-body" style="margin-left:auto">Our widest. Stacks over trainers.</span></div><div><span class="sm soft">Inseam</span><b>32″</b><span class="t-body" style="margin-left:auto">Cut long — break or cuff it.</span></div></div>
          </div>`],
        ["One giant price, small text in the corners", `
          <span class="corner" style="left:var(--gut);top:72px">Every jean</span><span class="corner" style="right:var(--gut);top:72px;text-align:right">Six fits<br />40+ washes</span>
          <div class="num">₹2,199</div>
          <span class="corner" style="left:var(--gut);bottom:56px">Free shipping over ₹2,999<br />15-day returns</span><a class="corner" style="right:var(--gut);bottom:56px;text-decoration:underline" href="#">Shop denim</a>`],
        ["How it's made — three steps", `
          <div class="head"><h2 class="t-sec">From mill to you</h2><a class="u" href="#">Our process</a></div>
          <div class="made">${[["Dye", "Rope-dyed indigo at our sister mill.", "/assets/denim-banner-hulk-BLGnSwTZ.jpg"], ["Cut", "Patterns drafted and cut in Delhi.", "/assets/About2-2b59lb8O.png"], ["Wash", "Each wash finished by hand.", "/assets/denim-banner-rock-Dh8R2dSg.jpg"]].map(([t, l, s]) => `<div><div class="img"><img src="${s}" alt="" /></div><h3>${t}</h3><p class="t-body">${l}</p></div>`).join("")}</div>`],
        ["Wash swatches — close-up fabric", `
          <div class="head"><h2 class="t-sec">Pick your wash</h2><span class="sm soft">Brawny · ${brawny.length} washes</span></div>
          <div class="sw">${brawny.map((p) => `<a href="#"><div class="chip grey"><img src="${front(p)}" alt="" /></div><p>${color(p)}</p></a>`).join("")}</div>
          <p class="t-body" style="margin-top:20px">Same cut, eight washes. Hover a swatch to see more of the fabric.</p>`],
        ["Shop the look — cut-out model + pieces", `
          <div class="look"><div class="l"><img class="cut" src="/assets/fits/jazz.png" alt="" /></div>
            <div class="r"><div><p class="sm soft">The look</p><h3 class="t-big" style="font-size:clamp(36px,4.4vw,76px);margin-top:12px">All black,<br />washed grey</h3></div>
            <ul>${["jazz-3190-black", "denim-shirt-0038-black", "joggers-2001-black"].map(P).filter(Boolean).map((p) => `<li><img src="${model(p)}" alt="" /><span>${p.name}</span><b>${inr(p.price)}</b></li>`).join("")}</ul>
            <a class="btn" href="#">Add the look</a></div></div>`],
        ["Wear diary — how it fades over a year", `
          <div class="head"><h2 class="t-sec">One pair, one year</h2><span class="sm soft">Worn by a customer in Delhi</span></div>
          <div class="diary">${[["Day 1", "/assets/rock-166-raw-wash-model-D8dRd9Nj.jpg"], ["Month 3", "/assets/jazz-3214-mid-blue-model-DYM_tvbB.jpg"], ["Month 6", "/assets/hulk-32003-mid-blue-model-Cn1adhjB.jpg"], ["Month 12", "/assets/hulk-32004-ice-berg-model-CuuoMm6m.jpg"]].map(([t, s]) => `<div><div class="img grey"><img src="${s}" alt="" /></div><p><b>${t}</b><span class="soft">Rock raw</span></p></div>`).join("")}</div>
          <div class="line"></div><p class="t-body">Raw denim fades to the way you live. Send us yours — we'll feature it here.</p>`],
        ["Care rules — four columns", `
          <div class="head"><h2 class="t-sec">Look after it</h2><a class="u" href="#">Full care guide</a></div>
          <div class="care"><div><b>Wash less</b><p class="t-body">Every ten wears is plenty.</p></div><div><b>Inside out</b><p class="t-body">Keeps the colour where it belongs.</p></div><div><b>Hang dry</b><p class="t-body">No tumble dryer — it shrinks and stiffens.</p></div><div><b>Don't iron fades</b><p class="t-body">They took months. Leave them be.</p></div></div>`],
        ["Visit the studio", `
          <div class="studio"><div class="img"><img src="/assets/About1-C60kMP7t.png" alt="" /></div>
            <div class="r"><p class="sm">The studio</p><div><h3 class="t-big" style="font-size:clamp(36px,4.2vw,72px)">Come try<br />them on</h3><p class="t-body" style="margin-top:16px">Every fit and wash in one room. Bring your own jeans and we'll match the fit.</p></div>
            <dl><dt>Address</dt><dd style="margin:0">Industrial Area A, Delhi</dd><dt>Hours</dt><dd style="margin:0">Tue–Sun, 11–8</dd><dt>Call</dt><dd style="margin:0">WhatsApp us</dd></dl></div></div>`],
        ["Moving words + a product row", `
          <div class="mq"><div>${"Rope-dyed <i>/</i> Cut in Delhi <i>/</i> Since 2006 <i>/</i> ".repeat(4)}</div></div>
          <div class="row5">${["hulk-32004-ice-berg", "denim-shirt-0043-ice-berg", "jazz-3190-black", "corduroy-shirt-0041-beige", "rock-166-raw-wash"].map(P).map((p) => `<a href="#"><div class="img"><img src="${model(p)}" alt="" /></div><p>${p.type} ${inr(p.price)}</p></a>`).join("")}</div>`],
        ["Numbers around a cut-out", `
          <div class="nums">
            <div class="col"><div><b>2006</b><span class="sm soft">First pair cut</span></div><div><b>06</b><span class="sm soft">Fits</span></div></div>
            <div class="fig"><img class="cut" src="/assets/fits/brawny.png" alt="" /></div>
            <div class="col r"><div><b>40+</b><span class="sm soft">Washes</span></div><div><b>100%</b><span class="sm soft">Made in India</span></div></div>
          </div>`],
        ["Dark sign-up block", `
          <p class="sm">Early access</p><h2 class="t-big" style="margin-top:16px">First to the drop</h2><p class="t-body">New washes go to the list a day early — plus 10% off your first order.</p>
          <form onsubmit="return false"><input type="email" placeholder="E-mail address" /><button type="submit">Join</button></form>`],
      ];

      const deck = document.getElementById("deck");
      deck.innerHTML = slides.map(([name, html], i) => `<section class="s${i === 2 ? " price" : ""}${i === 11 ? " join" : ""}"><span class="tag">${String(i + 1).padStart(2, "0")} — ${name}</span>${html}</section>`).join("");
      const all = [...deck.children];
      const count = document.getElementById("count");
      const upd = () => { const i = Math.round(deck.scrollTop / innerHeight); count.textContent = `${Math.min(i + 1, all.length)} / ${all.length} · scroll or ↓`; };
      deck.addEventListener("scroll", upd, { passive: true }); upd();
      addEventListener("keydown", (e) => {
        const i = Math.round(deck.scrollTop / innerHeight);
        if (e.key === "ArrowDown" || e.key === "ArrowRight") all[Math.min(i + 1, all.length - 1)].scrollIntoView({ behavior: "smooth" });
        if (e.key === "ArrowUp" || e.key === "ArrowLeft") all[Math.max(i - 1, 0)].scrollIntoView({ behavior: "smooth" });
      });
      document.querySelectorAll("a[href='#']").forEach((a) => a.addEventListener("click", (e) => e.preventDefault()));
    </script>
  </body>
</html>
